<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>
</head>
<body>

<h2>Add Student</h2>

<form th:action="@{/users}" th:object="${user}" method="post">
    <input type="text" th:field="*{student}" placeholder="Student Name" required />
    <input type="text" th:field="*{studentId}" placeholder="Student ID" required />
    <input type="number" step="0.01" th:field="*{cgpa}" placeholder="CGPA" required />
    <button type="submit">Save</button>
</form>

<hr>

<h2>Student List</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Student</th>
        <th>Student ID</th>
        <th>CGPA</th>
        <th>Actions</th>
    </tr>

    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.student}"></td>
        <td th:text="${user.studentId}"></td>
        <td th:text="${user.cgpa}"></td>
        <td>
            <a th:href="@{'/users/edit/' + ${user.id}}">Edit</a>
            <form th:action="@{'/users/' + ${user.id}}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

</body>
</html>
